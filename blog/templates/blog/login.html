{% extends 'blog/base.html' %}
{% block title %}Login — My Blog{% endblock %}
{% block content %}

<style>
    body {
        background: linear-gradient(180deg, #2B124C, #522B5B, #854F6C);
        min-height: 100vh;
        font-family: 'Poppins', sans-serif;
        margin: 0;
        color: #FBE4D8;
    }

    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 140px);
    }

    .login-card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 40px 35px;
        width: 400px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .login-card h3 {
        margin-bottom: 25px;
        font-weight: 600;
        color: #FBE4D8;
    }

    .input-group {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        margin-bottom: 18px;
        padding: 0 12px;
    }

    .input-group i {
        color: #DFB6B2;
        font-size: 1.1rem;
        margin-right: 10px;
    }

    .form-control {
        flex: 1;
        height: 45px;
        background: transparent;
        border: none;
        color: #FBE4D8;
        padding-left: 5px;
    }

    .form-control::placeholder {
        color: #FBE4D8;
        opacity: 0.8;
    }

    .form-control:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.20);
    }

    .btn-login {
        width: 100%;
        background: #854F6C;
        border: none;
        padding: 12px;
        color: #FBE4D8;
        font-weight: 600;
        border-radius: 10px;
        transition: 0.3s;
    }

    .btn-login:hover {
        background: #DFB6B2;
        color: #2B124C;
        transform: scale(1.02);
    }

    .extra-links a {
        text-decoration: none;
        font-size: 0.9rem;
        color: #DFB6B2;
    }

    .extra-links a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <h3>Welcome Back</h3>

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <i data-feather="user"></i>
                <input type="text" name="username" placeholder="Username" class="form-control" required>
            </div>

            <div class="input-group">
                <i data-feather="lock"></i>
                <input type="password" name="password" placeholder="Password" class="form-control" required>
            </div>

            <button type="submit" class="btn-login">Log In</button>
        </form>

        <p class="extra-links mt-3">
            Don’t have an account? <a href="{% url 'register' %}">Register</a>
        </p>
    </div>
</div>

<script src="https://unpkg.com/feather-icons"></script>
<script>
    feather.replace();
</script>

{% endblock %}
