{% extends 'blog/base.html' %}
{% block title %}Login — My Blog{% endblock %}
{% block content %}

<style>
.login-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 150px);
}
.login-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 40px 35px;
  width: 400px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
  color: #fbe4d8;
}
.login-card h3 {
  margin-bottom: 25px;
  font-weight: 600;
  color: #dfb6b2;
}
.input-group {
  display: flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  margin-bottom: 18px;
  padding: 0 12px;
}
.input-group i {
  color: #dfb6b2;
  font-size: 1.1rem;
  margin-right: 10px;
}
.form-control {
  flex: 1;
  height: 45px;
  background: transparent;
  border: none;
  color: #fbe4d8;
  padding-left: 5px;
}
.form-control::placeholder {
  color: #fbe4d8;
  opacity: 0.8;
}
.form-control:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.2);
}
.btn-login {
  width: 100%;
  background: #854f6c;
  border: none;
  padding: 12px;
  color: #fbe4d8;
  font-weight: 600;
  border-radius: 10px;
  transition: 0.3s;
}
.btn-login:hover {
  background: #dfb6b2;
  color: #2b124c;
  transform: scale(1.03);
}
.extra-links a {
  text-decoration: none;
  font-size: 0.9rem;
  color: #dfb6b2;
}
.extra-links a:hover {
  text-decoration: underline;
}
</style>

<div class="login-wrapper">
  <div class="login-card">
    <h3><i class="fa-solid fa-right-to-bracket icon"></i> Welcome Back</h3>

    <form method="POST">
      {% csrf_token %}
      <div class="input-group">
        <i class="fa-regular fa-user"></i>
        <input type="text" name="username" placeholder="Username" class="form-control" required>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="password" placeholder="Password" class="form-control" required>
      </div>

      <button type="submit" class="btn-login">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Log In
      </button>
    </form>

    <p class="extra-links mt-3">
      Don’t have an account? <a href="{% url 'register' %}">Register here</a>
    </p>
  </div>
</div>

{% endblock %}
