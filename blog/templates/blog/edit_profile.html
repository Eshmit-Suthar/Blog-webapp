{% extends 'blog/base.html' %}
{% load static %}
{% block content %}
<div class="container mt-5">
  <div class="card shadow p-4 rounded-3" style="max-width: 600px; margin: 0 auto;">
    <h2 class="text-center mb-4">Edit Profile</h2>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      
      <!-- Profile Picture -->
      <div class="text-center mb-3">
        {% if user.profile.profile_pic %}
          <img src="{{ user.profile.profile_pic.url }}" alt="Profile Picture" 
               class="rounded-circle border" width="120" height="120">
        {% else %}
          <img src="{% static 'images/default-profile.png' %}" alt="Default Profile" 
               class="rounded-circle border" width="120" height="120">
        {% endif %}
      </div>

      <!-- Form Fields -->
      <div class="form-group mb-3">
        <label for="id_bio" class="form-label fw-semibold">Bio</label>
        {{ form.bio|add_class:"form-control" }}
      </div>

      <div class="form-group mb-3">
        <label for="id_profile_pic" class="form-label fw-semibold">Profile Picture</label>
        {{ form.profile_pic|add_class:"form-control" }}
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'profile' user.username %}" class="text-decoration-none text-secondary">Cancel</a>
    </div>
  </div>
</div>
{% endblock %}
