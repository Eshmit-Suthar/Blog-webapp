{% extends 'blog/base.html' %}
{% load static %}

{% block content %}
<style>
body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: 'Poppins', sans-serif;
}

.login-container {
    max-width: 400px;
    margin: 80px auto;
    padding: 40px;
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    color: white;
}

.login-container h2 {
    text-align: center;
    margin-bottom: 25px;
    font-weight: 600;
}

.login-container form {
    display: flex;
    flex-direction: column;
}

.login-container label {
    margin-bottom: 5px;
    font-weight: 500;
}

.login-container input[type="text"],
.login-container input[type="password"] {
    padding: 10px;
    margin-bottom: 20px;
    border: none;
    border-radius: 10px;
    outline: none;
}

.login-container button {
    background: #6c63ff;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s ease;
}

.login-container button:hover {
    background: #5848d9;
}

.login-container .register-link {
    text-align: center;
    margin-top: 15px;
}
</style>

<div class="login-container">
    <h2>Welcome Back 👋</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <div class="register-link">
        <p>Don’t have an account? <a href="{% url 'register' %}" style="color:#fff;text-decoration:underline;">Register</a></p>
    </div>
</div>
{% endblock %}
